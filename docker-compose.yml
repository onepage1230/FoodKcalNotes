version: "3.8"

# 伺服器只監聽 127.0.0.1，所以必須用 host 網路；手機經主機上的 Tailscale serve 連入。
# 設定放在同資料夾的 .env（見 .env.example）。
services:
  foodkcal:
    build: .
    image: foodkcalnotes:local
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Taipei}   # 餐點日期、時間與用餐時段都用伺服器本地時間，容器預設是 UTC
      PORT: "3000"
      MEAL_JOURNAL_DATA_DIR: /data
      REMOTE_ORIGINS: ${REMOTE_ORIGINS}
      OWNER_LOGIN: ${OWNER_LOGIN}
      FRIENDS_DAILY_LIMIT: ${FRIENDS_DAILY_LIMIT:-30}   # 其他 Tailscale 身分每天的 AI 分析次數，0 不限
      OWNER_TOKEN: ${OWNER_TOKEN:-1}   # 擁有者必須用配對碼配對過的瀏覽器；host 網路上的其他程式拿不到主日誌。配對碼見 docker-compose logs
    volumes:
      - ${DATA_DIR:-./data-store}:/data
